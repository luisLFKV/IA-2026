# Base de conocimiento para decidir el acceso nocturno a la biblioteca.
# Las reglas y los hechos conservan el orden establecido en el ejercicio.
facts:
  - Estudiante(Ana)
  - Estudiante(Luis)
  - Profesor(Marta)
  - TieneCredencial(Ana)
  - TieneCredencial(Marta)
  - HorarioNocturno(Hoy)

rules:
  - id: R_miembro_est
    if: [Estudiante(x), TieneCredencial(x)]
    then: Miembro(x)

  - id: R_miembro_prof
    if: [Profesor(x)]
    then: Miembro(x)

  - id: R_acceso
    if: [Miembro(x), HorarioNocturno(Hoy)]
    then: AccesoNoche(x)

  - id: R_beca
    if: [Estudiante(x), TieneCredencial(x)]
    then: Becario(x)

query: AccesoNoche(Ana)
